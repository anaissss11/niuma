<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#007aff"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>牛马打卡</title></head><body><div class="card"><h1>🐂 牛马打卡</h1><div class="section"><div class="label">今日上班时间</div><div class="time-big" id="startTime">未打卡</div></div><div class="section"><div class="label">预计下班时间</div><div class="time-big leave" id="leave">--:--</div></div><button class="btn start" onclick="clockIn()">🟢 上班打卡</button><button class="btn end" onclick="clockOut()">🔴 下班打卡</button><button class="btn edit" onclick="modifyStartTime()">📝 修改上班时间</button><div class="history"><h2>历史记录</h2><div id="historyList"></div></div></div><script src="app.js"></script></body></html>
